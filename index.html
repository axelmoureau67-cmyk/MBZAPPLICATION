<style>
  :root {
    --bg-0: #0A0A0F;
    --bg-1: #131318;
    --surface: #18181F;
    --surface-2: #1D1D26;
    --border: #2A2A35;
    --border-soft: #24242e;
    --violet: #8B5CF6;
    --violet-dark: #7C3AED;
    --violet-light: #A78BFA;
    --violet-tint: rgba(139,92,246,0.14);
    --text: #F1F5F9;
    --text-muted: #94A3B8;
  }
  html, body {
    min-height: 100vh;
    height: auto;
    overflow-x: hidden;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    background: radial-gradient(1200px 800px at 15% -10%, #1b1530 0%, transparent 55%),
                radial-gradient(1000px 700px at 110% 10%, #14122a 0%, transparent 50%),
                linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 100%);
    background-attachment: fixed;
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--text);
  }
  * { -webkit-tap-highlight-color: transparent; }
  ::selection { background: var(--violet); color: #fff; }
  [data-lucide] { width: 1em; height: 1em; stroke-width: 1.75; }

  /* =========================================================
     ESPACE ELEVE — même DA que le panel admin, plein écran
     desktop via grille responsive, colonne unique sur mobile.
  ========================================================= */
  .app-shell {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    height: auto;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: visible;
  }
  @media (min-width: 1024px) {
    .app-shell {
      max-width: 1180px;
      min-height: 100vh;
      height: auto;
      margin: 0 auto;
      padding: 40px 32px 80px;
      background: transparent;
      box-shadow: none;
      overflow: visible;
    }
    .app-shell.pb-36 { padding-bottom: 40px; }
    .login-panel { min-height: 70vh; }
  }

  /* =========================================================
     Bouton "Suivant" du questionnaire
     - Mobile : reste fixé en bas (fixed bottom-0)
     - Desktop (>=1024px) : repasse dans le flux normal, sous
       le dernier bloc de questions, avec un espace (mt-8)
  ========================================================= */
  .cta-fixed-wrap {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 40;
  }
  @media (min-width: 1024px) {
    .cta-fixed-wrap {
      position: static;
      margin-top: 2rem; /* mt-8 */
    }
    .cta-fixed-wrap .cta-wrap {
      background: none !important;
      padding: 0 !important;
    }
  }

  /* Grille desktop pour le tableau de bord élève (fiche + programme) */
  .student-layout { display: block; }
  @media (min-width: 1024px) {
    .student-layout {
      display: grid;
      grid-template-columns: 360px 1fr;
      align-items: start;
      gap: 28px;
    }
    .student-layout .student-col-side { position: sticky; top: 40px; }
  }

  /* Espace admin : mêmes tokens visuels que l'espace élève */
  .admin-shell {
    max-width: 1180px;
    margin: 0 auto;
    min-height: 100vh;
    padding: 24px 20px 60px;
    color: var(--text);
  }
  @media (min-width: 768px) {
    .admin-shell { padding: 40px 32px 80px; }
  }

  /* Composants "carte" partagés entre les deux espaces (miroir visuel) */
  .surface-card, .admin-card, .admin-student-card, .admin-kpi, .admin-form {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: 0 12px 32px -18px rgba(0,0,0,.55);
    transition: border-color .2s ease, transform .2s ease, box-shadow .2s ease;
  }
  .admin-student-card:hover { border-color: #3d3d52; }

  .admin-topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 24px; }
  .admin-eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--violet-light); font-weight: 600; margin-bottom: 2px; }
  .admin-title { font-size: 22px; font-weight: 800; color: #F8FAFC; }
  .admin-link-btn { font-size: 12px; color: var(--text-muted); text-decoration: underline; text-underline-offset: 2px; }
  .admin-kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
  @media (min-width: 640px) { .admin-kpis { grid-template-columns: repeat(4, 1fr); } }
  .admin-kpi { padding: 16px; text-align: center; cursor: pointer; user-select: none; }
  .admin-kpi:hover { border-color: #3d3d52; }
  .admin-kpi.active { border-color: var(--violet); box-shadow: 0 0 0 1px var(--violet) inset; }
  .admin-kpi-num { display: block; font-size: 24px; font-weight: 800; color: #F8FAFC; }
  .admin-kpi-label { display: block; font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .admin-toolbar { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
  @media (min-width: 640px) { .admin-toolbar { flex-direction: row; align-items: center; } }
  .admin-search-wrap { position: relative; flex: 1; width: 100%; }
  .admin-search-wrap [data-lucide] { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 15px; }
  .admin-search-input {
    width: 100%; background: var(--bg-1); border: 1px solid var(--border); color: var(--text);
    border-radius: 12px; padding: 10px 14px 10px 38px; font-size: 14px; transition: border-color .15s ease;
  }
  .admin-search-input::placeholder { color: #5f5f72; }
  .admin-search-input:focus { outline: none; border-color: var(--violet); }
  .admin-add-btn { width: auto; white-space: nowrap; padding: 10px 20px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px; }
  .admin-student-card { padding: 16px; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .status-dot { width: 8px; height: 8px; border-radius: 999px; display: inline-block; margin-right: 6px; flex-shrink: 0; }
  .admin-student-metrics { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
  .admin-student-actions { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
  .admin-btn-secondary {
    font-size: 11px; font-weight: 600; color: var(--text); background: var(--bg-1);
    border: 1px solid var(--border); border-radius: 999px; padding: 6px 12px; white-space: nowrap;
  }
  .admin-btn-secondary:hover { border-color: var(--violet); color: var(--violet-light); }

function firstInvalidStep() {

/* =========================================================
   PERSISTANCE (Supabase) — remplace l'ancien localStorage :
   la table students est la source de vérité, ce qui permet
   à l'administrateur de voir/modifier les programmes de ses élèves.
========================================================= */
async function saveProfile() {
  const targetId = state.viewingStudentId || state.session.userId;
  if (!targetId) return;
  try {
    await supabaseClient.from('students')
      .update({ data: state.data, updated_at: new Date().toISOString() })
      .eq('id', targetId);
  } catch (e) { /* réseau indisponible : on continue sans bloquer */ }
}

async function loadSessionProfile(userId) {
  const { data: profile, error } = await supabaseClient.from('students').select('*').eq('id', userId).single();
  if (error || !profile) {
    state.authError = 'Profil introuvable — contacte l\'administrateur.';
    await supabaseClient.auth.signOut();
    state.authLoading = false;
    render();
    return;
  }
  state.session = {
    userId: profile.id,
    identifiant: profile.identifiant,
    isAdmin: !!profile.is_admin,
    nom: profile.nom || '',
    prenom: profile.prenom || ''
  };
  state.viewingStudentId = profile.id;
  state.data = Object.assign(defaultData(), profile.data || {});
  state.authLoading = false;
  if (profile.is_admin) {
    state.adminView = 'dashboard';
    await loadStudentsList();
  } else {
    state.step = firstInvalidStep();
    render();
    loadTrackingData(profile.id); // habitudes / carnet / évolution — en arrière-plan, ne bloque pas l'affichage
  }
}

async function initApp() {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session && session.user) {
    await loadSessionProfile(session.user.id);
  } else {
    state.authLoading = false;
    render();
  }
}

function todayISO() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}

/* Charge en une fois les 3 sources de suivi pour l'élève affiché
   (soi-même, ou l'élève consulté par l'administrateur), puis rafraîchit l'UI. */
async function loadTrackingData(studentId) {
  state.streakLoaded = false;
  await Promise.all([
    loadTodayHabits(studentId),
    loadBodyProgress(studentId),
    loadStreakHistory(studentId)
  ]);
  render();
}

/* --- Donut Chart nutrition (Chart.js) --- */
const MACRO_COLORS = { prot: '#8B6BE8', lip: '#C4B5FD', gluc: '#F472B6' };

function macroShares(m) {
  if (!m) return null;
  const k = { prot: m.prot * 4, lip: m.lip * 9, gluc: m.gluc * 4 };
  const total = k.prot + k.lip + k.gluc;
  if (!(total > 0)) return null;
  return { prot: Math.round(k.prot / total * 100), lip: Math.round(k.lip / total * 100), gluc: Math.round(k.gluc / total * 100) };
}

function renderMacroTile(key, label, macros, sub) {
  const shares = macroShares(macros);
  return `
    <div class="nutri-tile">
      <span class="nutri-tile-label"><span class="nutri-dot" style="background:${MACRO_COLORS[key]}"></span>${label}</span>
      <p class="text-lg font-bold leading-tight mt-1">${macros ? macros[key] : '—'} g</p>
      <p class="text-[10px] text-muted">${sub}</p>
      ${shares ? `<p class="text-[10px] font-semibold mt-0.5" style="color:${MACRO_COLORS[key]}">${shares[key]} % des kcal</p>` : ''}
    </div>`;
}

let nutritionChartInstance = null;
function drawNutritionChart() {
  if (nutritionChartInstance) { nutritionChartInstance.destroy(); nutritionChartInstance = null; }
  const canvas = document.getElementById('nutrition-donut');
  if (!canvas || !window.Chart) return;
  const grams = [Number(canvas.dataset.prot), Number(canvas.dataset.lip), Number(canvas.dataset.gluc)];
  if (!grams.every(v => Number.isFinite(v) && v >= 0)) return;
  const kcal = [grams[0] * 4, grams[1] * 9, grams[2] * 4];
  const total = kcal.reduce((a, b) => a + b, 0);
  if (!(total > 0)) return;
  nutritionChartInstance = new Chart(canvas.getContext('2d'), {
    type: 'doughnut',
    data: {
      labels: ['Protéines', 'Lipides', 'Glucides'],
      datasets: [{
        data: kcal,
        backgroundColor: [MACRO_COLORS.prot, MACRO_COLORS.lip, MACRO_COLORS.gluc],
        borderWidth: 0, spacing: 3, borderRadius: 6, hoverOffset: 4
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false, cutout: '72%',
      animation: { duration: 700 },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#14111f', borderColor: 'rgba(255,255,255,.12)', borderWidth: 1,
          titleColor: '#fff', bodyColor: '#C4B5FD', displayColors: false,
          callbacks: {
            label: (ctx) => ' ' + grams[ctx.dataIndex] + ' g · ' + Math.round(kcal[ctx.dataIndex] / total * 100) + ' % des kcal'
          }
        }
      }
    }
  });
}

/* Upload direct vers Cloudinary (API Upload non-signée) : renvoie l'URL sécurisée (secure_url). */
async function uploadToCloudinary(file) {
  const formData = new FormData();
  formData.append('file', file);
  formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
  const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
    method: 'POST',
    body: formData
  });
  if (!res.ok) throw new Error('Échec de l\'envoi Cloudinary');
  const data = await res.json();
  if (!data.secure_url) throw new Error('Réponse Cloudinary invalide');
  return data.secure_url;
}

async function onPhotoFileSelected(slot, inputEl) {
  const studentId = state.viewingStudentId || state.session.userId;
  const file = inputEl.files && inputEl.files[0];
  if (!studentId || !file) return;
  const date = todayISO();
  const label = document.getElementById('evo-photo-status-' + slot);
  state.photoUploading[slot] = true;
  renderEvolutionTabInner();
  if (label) label.textContent = 'Envoi en cours…';
  try {
    const secureUrl = await uploadToCloudinary(file);
    const field = slot === 'face' ? 'photo_face_url' : 'photo_profil_url';
    const poids = state.bodyProgress.entries.find(e => e.date === date)?.poids;
    await supabaseClient.from('body_progress').upsert({ student_id: studentId, date, poids, [field]: secureUrl }, { onConflict: 'student_id,date' });
    const existing = state.bodyProgress.entries.find(e => e.date === date);
    if (existing) existing[field] = secureUrl; else state.bodyProgress.entries.push({ date, [field]: secureUrl });
    state.photoUploading[slot] = false;
    renderEvolutionTabInner();
  } catch (e) {
    state.photoUploading[slot] = false;
    if (label) label.textContent = "Échec de l'envoi, réessaie.";
    renderEvolutionTabInner();
  }
}

/* =========================================================
   PARAMETRES ELEVE — changement de mot de passe
   Le mot de passe actuel est re-vérifié via signInWithPassword
   (l'élève se réauthentifie lui-même) AVANT d'appeler
   supabase.auth.updateUser(), pour ne jamais mettre à jour le
   mot de passe sans preuve qu'il connaît l'actuel.
========================================================= */
async function changeMyPassword() {
  const curEl = document.getElementById('pw-current');
  const newEl = document.getElementById('pw-new');
  const confirmEl = document.getElementById('pw-confirm');
  const current = curEl ? curEl.value : '';
  const next = newEl ? newEl.value : '';
  const confirmVal = confirmEl ? confirmEl.value : '';

  state.pwChangeSuccess = null;

  if (!current || !next || !confirmVal) {
    state.pwChangeError = 'Remplis les 3 champs.';
    render();
    return;
  }
  if (next.length < 6) {
    state.pwChangeError = 'Le nouveau mot de passe doit faire 6 caractères minimum.';
    render();
    return;
  }
  if (next !== confirmVal) {
    state.pwChangeError = 'Le nouveau mot de passe et sa confirmation ne correspondent pas.';
    render();
    return;
  }

  state.pwChangeError = null;
  state.pwChangeLoading = true;
  render();

  try {
    // Re-vérification du mot de passe actuel (re-authentification native Supabase).
    const { error: reauthErr } = await supabaseClient.auth.signInWithPassword({
      email: toFakeEmail(state.session.identifiant),
      password: current
    });
    if (reauthErr) {
      state.pwChangeLoading = false;
      state.pwChangeError = 'Mot de passe actuel incorrect.';
      render();
      return;
    }

    const { error: updateErr } = await supabaseClient.auth.updateUser({ password: next });
    if (updateErr) throw updateErr;

    state.pwChangeLoading = false;
    state.pwChangeSuccess = 'Mot de passe mis à jour avec succès !';
    if (curEl) curEl.value = '';
    if (newEl) newEl.value = '';
    if (confirmEl) confirmEl.value = '';
    render();
  } catch (e) {
    state.pwChangeLoading = false;
    state.pwChangeError = translateSupabaseError(e);
    render();
  }
}

/* Statut d'un élève selon la date de son dernier bilan */
function getStudentStatus(s) {
  const last = s.data && s.data.lastTestDate;
  if (!last) return { level: 'none', label: 'Bilan non fait', color: '#94A3B8' };
  const days = Math.floor((Date.now() - last) / 86400000);
  const remaining = RETEST_DELAY_DAYS - days;
  if (remaining > 3) return { level: 'ok', label: 'À jour', color: '#34D399' };
  if (remaining >= 0) return { level: 'soon', label: 'Retest bientôt', color: '#FBBF24' };
  return { level: 'late', label: 'Retest en retard', color: '#F87171' };
}

function computeKPIs() {
  const k = { total: state.students.length, ok: 0, soon: 0, late: 0, none: 0 };
  state.students.forEach(s => { k[getStudentStatus(s).level]++; });
  return k;
}

function filteredStudents() {
  const q = (state.studentSearch || '').trim().toLowerCase();
  let list = state.students;
  if (state.studentStatusFilter) {
    list = list.filter(s => getStudentStatus(s).level === state.studentStatusFilter);
  }
  if (!q) return list;
  return list.filter(s =>
    (s.prenom || '').toLowerCase().includes(q) ||
    (s.nom || '').toLowerCase().includes(q) ||
    (s.identifiant || '').toLowerCase().includes(q)
  );
}

async function createStudentSubmit() {

  const identifiant = document.getElementById('new-identifiant').value.trim();
  const password = document.getElementById('new-password').value;

    render();

  }
  if (password.length < 6) {

    render();
    return;
  }

  state.createError = null;
  state.createLoading = true;
  render();

  try {
    // Client temporaire pour ne pas écraser la session admin en cours.
    const tempClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: false, autoRefreshToken: false }
    });
    const { data, error } = await tempClient.auth.signUp({
      email: toFakeEmail(identifiant),
      password
    });
    if (error) throw error;
    const newId = data.user.id;
    const isEmail = identifiant.includes('@');
    const { error: insertErr } = await tempClient.from('students').insert({
      id: newId, identifiant, nom, prenom, email: isEmail ? identifiant : null, is_admin: false, data: {}
    });
    if (insertErr) throw insertErr;

    state.creatingAccount = false;
    state.createLoading = false;
    await loadStudentsList();
  } catch (e) {
    state.createLoading = false;
    state.createError = translateSupabaseError(e);
    render();
  }

/* =========================================================
   ACTIONS ADMIN SENSIBLES (mot de passe / suppression de compte)
   ---------------------------------------------------------
   La clé anon (publique, embarquée dans ce fichier) ne permet PAS
   de modifier le mot de passe ou de supprimer un AUTRE utilisateur :
   ce sont des opérations qui exigent la clé service_role, qui ne
   doit jamais être exposée côté client. Elles passent donc par la
   fonction Edge Supabase sécurisée "admin-user-mgmt" (à déployer
   séparément), qui vérifie elle-même côté serveur que l'appelant a
   bien is_admin = true avant d'utiliser ses droits élevés.
========================================================= */
async function adminInvoke(action, payload) {
  const { data, error } = await supabaseClient.functions.invoke('admin-user-mgmt', {
    body: { action, ...payload }
  });
  if (error) throw error;
  if (data && data.error) throw new Error(data.error);
  return data;
}

async function saveStudentProfile(id) {
  const s = state.students.find(x => x.id === id);
  if (!s) return;
  const prenom = document.getElementById(`edit-prenom-${id}`).value.trim();
  const nom = document.getElementById(`edit-nom-${id}`).value.trim();
  const identifiant = document.getElementById(`edit-identifiant-${id}`).value.trim();
  const newPassword = document.getElementById(`edit-password-${id}`).value;

  if (!prenom || !nom || !identifiant) {
    state.editProfileError = 'Prénom, nom et identifiant sont obligatoires.';
    render();
    return;
  }
  if (newPassword && newPassword.length < 6) {
    state.editProfileError = 'Le nouveau mot de passe doit faire 6 caractères minimum.';
    render();
    return;
  }

  state.editProfileError = null;
  state.editProfileLoading = true;
  render();

  const identifiantChanged = identifiant !== s.identifiant;
  const isEmail = identifiant.includes('@');

  try {
    // Mot de passe et/ou identifiant (= email d'authentification) : passe par la
    // fonction Edge sécurisée, exécutée AVANT la mise à jour de la fiche pour ne
    // jamais désynchroniser l'identifiant affiché de l'email réellement utilisable
    // pour se connecter.
    if (newPassword || identifiantChanged) {
      await adminInvoke('update_auth', {
        user_id: id,
        new_password: newPassword || undefined,
        new_email: identifiantChanged ? toFakeEmail(identifiant) : undefined
      });
    }
    await supabaseClient.from('students').update({
      prenom, nom, identifiant, email: isEmail ? identifiant : null
    }).eq('id', id);

    state.editingProfileId = null;
    state.editProfileLoading = false;
    await loadStudentsList();
  } catch (e) {
    state.editProfileLoading = false;
    state.editProfileError = (newPassword || identifiantChanged)
      ? 'Échec : vérifie que la fonction serveur "admin-user-mgmt" est bien déployée (nécessaire pour changer le mot de passe ou l\'identifiant d\'un élève).'
      : translateSupabaseError(e);
    render();
  }
}

async function deleteStudent(id) {
  const s = state.students.find(x => x.id === id);
  if (!s) return;
  const fullName = `${s.prenom || ''} ${s.nom || ''}`.trim() || s.identifiant;
  const confirmed = window.confirm(`Es-tu sûr de vouloir supprimer définitivement le compte de ${fullName} ?`);
  if (!confirmed) return;

  state.studentActionError = null;
  try {
    // Supprime le compte d'authentification ET la fiche élève (fonction Edge sécurisée).
    await adminInvoke('delete_user', { user_id: id });
  } catch (e) {
    // Fonction Edge non déployée / indisponible : on supprime au moins la fiche élève
    // pour ne pas bloquer l'admin. Le compte d'authentification restera orphelin
    // (l'élève ne pourra plus accéder à son profil, cf. "Profil introuvable").
    try {
      await supabaseClient.from('students').delete().eq('id', id);
    } catch (e2) {
      state.studentActionError = 'Suppression impossible pour le moment.';
    }
  }
  await loadStudentsList();
}

/* =========================================================
   SELECTION GENERIQUE (pas de re-render global -> pas d'animation)
========================================================= */
function handleSingleSelect(el) {
  const group = el.dataset.group;
  const value = el.dataset.value;
  state.data[group] = NUMERIC_GROUPS.includes(group) ? Number(value) : value;
  document.querySelectorAll('[data-group="' + group + '"]').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
  updateCta();
}

function handleMateriel(el) {
  const value = el.dataset.value;
  if (value === 'rien') {
    state.data.materiel = state.data.materiel.includes('rien') ? [] : ['rien'];
  } else {
    state.data.materiel = state.data.materiel.filter(x => x !== 'rien');
    if (state.data.materiel.includes(value)) {
      state.data.materiel = state.data.materiel.filter(x => x !== value);
    } else {
      state.data.materiel.push(value);
    }
  }
  refreshMaterielUI();
}

function refreshMaterielUI() {
  document.querySelectorAll('.materiel-btn').forEach(btn => {
    const val = btn.dataset.value;
    const checked = state.data.materiel.includes(val);
    btn.classList.toggle('selected', checked);
    const chk = btn.querySelector('.chk-box');
    chk.classList.toggle('checked', checked);
    chk.innerHTML = checked ? CHECK_SVG : '';
  });
  updateCta();
}

function onIdentityInput() {
  state.data.prenom = document.getElementById('in-prenom').value;
  state.data.age = document.getElementById('in-age').value;
  state.data.taille = document.getElementById('in-taille').value;
  state.data.poids = document.getElementById('in-poids').value;
  state.data.objectif = document.getElementById('in-objectif').value;

}

/* =========================================================
   CONSTRUCTION DU PROGRAMME
========================================================= */
const PROGRESS_CAP = 10; // reps bonus max avant de conseiller du lest

function getProgressState(key) {
  if (!state.data.progress) state.data.progress = {};
  if (!state.data.progress[key]) state.data.progress[key] = { streak: 0, bonus: 0, unlocked: false };
  return state.data.progress[key];
}

function applyBonusToReps(reps, bonus) {
  if (!bonus) return reps;
  const m = String(reps).match(/^(\d+)-(\d+)(.*)$/);
  if (!m) return reps;
  const low = parseInt(m[1], 10) + bonus;
  const high = parseInt(m[2], 10) + bonus;
  return low + '-' + high + m[3];
}

function baseExerciseFor(key) {
  const d = state.data;
  const hasBarre = d.materiel.includes('barre');
  const hasChaises = d.materiel.includes('chaises');
  const jn = Number(d.jambes);
  switch (key) {
    case 'push':     return pushMain(d.pompes);
    case 'shoulder': return shoulderAccessory(d.pompes);
    case 'triceps':  return tricepsMain(d.dips, hasChaises);
    case 'pull':      return pullMain(d.tractions, hasBarre);
    case 'pullFriday': return pullFriday(d.tractions);
    case 'trap':      return trapAccessory(d.tractions);
    case 'legs':      return legsMain(jn);
    case 'calf':      return calfAccessory();
    case 'core':      return coreAccessory(d.energie);
    default: return null;
  }
}

function withProgress(key) {
  const base = baseExerciseFor(key);
  const alt = getActiveAlternative(key, base);
  const exo = alt ? { ...base, ...alt, isAlt: true } : base;
  const prog = getProgressState(key);
  return { ...exo, key, reps: applyBonusToReps(exo.reps, prog.bonus) };
}

function altBucket(key) {
  const d = state.data;
  switch (key) {
    case 'push': case 'shoulder': return d.pompes;
    case 'triceps': return d.dips;
    case 'pull': case 'pullFriday': case 'trap': return d.tractions;
    case 'legs': return legsMain(Number(d.jambes)).label;
    case 'calf': return 'all';
    case 'core': return Number(d.energie) >= 5 ? 'haute' : 'basse';
    default: return null;
  }
}

function alternativesFor(key) {
  const d = state.data;
  const base = baseExerciseFor(key);
  if (!base) return [];
  const lib = ALT_LIBRARY[key];
  const list = (lib && lib[altBucket(key)]) || [];
  return list.filter(a => (!a.req || d.materiel.includes(a.req)) && a.nom !== base.nom);
}

function getActiveAlternative(key, base) {
  const name = state.data.alternatives && state.data.alternatives[key];
  if (!name) return null;
  return alternativesFor(key).find(a => a.nom === name) || null; // variante devenue invalide (nouveau niveau/matériel) -> exercice d'origine
}

function cycleAlternative(key) {
  const list = alternativesFor(key);
  if (!list.length) return;
  if (!state.data.alternatives) state.data.alternatives = {};
  const idx = list.findIndex(a => a.nom === state.data.alternatives[key]);
  const next = idx + 1;
  if (next >= list.length) delete state.data.alternatives[key]; // fin du cycle : retour à l'exercice d'origine
  else state.data.alternatives[key] = list[next].nom;
  saveProfile();
  refreshWeekDays();
}

function resetAlternative(key) {
  if (state.data.alternatives) delete state.data.alternatives[key];
  saveProfile();
  refreshWeekDays();
}

function renderAltRow(key) {
  if (!alternativesFor(key).length) return '';
  const active = !!(state.data.alternatives && state.data.alternatives[key]) && !!getActiveAlternative(key);
  return `
    <button type="button" class="alt-btn" onclick="cycleAlternative('${key}')"><i data-lucide="repeat-2" style="font-size:12px;"></i>Proposer une alternative</button>
    ${active ? `<span class="alt-badge">Variante</span><button type="button" class="alt-btn" onclick="resetAlternative('${key}')">Exercice d'origine</button>` : ''}
  `;
}

/* Re-génère le contenu des cartes jour (sans re-render global ni animation). */

  const box = document.getElementById('day-detail');

  if (!day) return;
  box.innerHTML = renderDayDetail(day);

/* =========================================================
   CHRONOMETRE DE REPOS (barre fixe en bas d'écran)
========================================================= */
const restTimer = { total: 0, remainingMs: 0, endAt: 0, status: 'idle', label: '', interval: null };

function escAttr(str) {
  return String(str == null ? '' : str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function parseRestSeconds(txt) {
  const t = String(txt || '').toLowerCase();
  const min = t.match(/(\d+)\s*min(?:\s*(\d+))?/);
  if (min) return parseInt(min[1], 10) * 60 + (min[2] ? parseInt(min[2], 10) : 0);
  const sec = t.match(/(\d+)/);
  return sec ? parseInt(sec[1], 10) : 60;
}

function ensureRestTimerEl() {
  let el = document.getElementById('rest-timer');
  if (el) return el;
  el = document.createElement('div');
  el.id = 'rest-timer';
  el.setAttribute('role', 'timer');
  el.innerHTML = `
    <div class="rt-card">
      <div class="rt-top">
        <span class="rt-label" id="rt-label"></span>
        <button type="button" class="rt-close" onclick="closeRestTimer()" aria-label="Fermer le chronomètre">✕</button>
      </div>
      <div class="rt-row">
        <span class="rt-time" id="rt-time">0:00</span>
        <div class="rt-actions">
          <button type="button" class="rt-primary" id="rt-toggle" onclick="toggleRestTimer()">Pause</button>
          <button type="button" id="rt-reset" onclick="resetRestTimer()">Reset</button>
        </div>
      </div>
      <div class="rt-bar"><span id="rt-bar-fill"></span></div>
      <div class="rt-status" id="rt-status" aria-live="polite"></div>
    </div>`;
  document.body.appendChild(el);
  return el;
}

function formatRest(ms) {
  const total = Math.max(0, Math.ceil(ms / 1000));
  return Math.floor(total / 60) + ':' + String(total % 60).padStart(2, '0');
}

function paintRestTimer() {
  const el = ensureRestTimerEl();
  el.classList.toggle('done', restTimer.status === 'done');
  document.getElementById('rt-label').textContent = 'Repos — ' + restTimer.label;
  document.getElementById('rt-time').textContent = formatRest(restTimer.remainingMs);
  const pct = restTimer.total > 0 ? Math.max(0, Math.min(100, (restTimer.remainingMs / (restTimer.total * 1000)) * 100)) : 0;
  document.getElementById('rt-bar-fill').style.width = pct + '%';
  const toggle = document.getElementById('rt-toggle');
  toggle.textContent = restTimer.status === 'running' ? 'Pause' : (restTimer.status === 'done' ? 'Relancer' : 'Reprendre');
  document.getElementById('rt-status').textContent = restTimer.status === 'done' ? 'Repos terminé ✓ — série suivante !' : '';
}

function restTick() {
  if (restTimer.status !== 'running') return;
  restTimer.remainingMs = restTimer.endAt - Date.now();
  if (restTimer.remainingMs <= 0) {
    restTimer.remainingMs = 0;
    restTimer.status = 'done';
    clearInterval(restTimer.interval);
    restTimer.interval = null;
    try { if (navigator.vibrate) navigator.vibrate([250, 120, 250]); } catch (e) { /* non supporté */ }
  }
  paintRestTimer();
}

function runRestTimer() {
  restTimer.status = 'running';
  restTimer.endAt = Date.now() + restTimer.remainingMs;
  clearInterval(restTimer.interval);
  restTimer.interval = setInterval(restTick, 250);
  paintRestTimer();
}

function startRestTimer(btn) {
  restTimer.total = parseRestSeconds(btn.dataset.rest);
  restTimer.remainingMs = restTimer.total * 1000;
  restTimer.label = btn.dataset.name || 'Exercice';
  ensureRestTimerEl().classList.add('open');
  runRestTimer();
}

function toggleRestTimer() {
  if (restTimer.status === 'running') {
    restTimer.remainingMs = Math.max(0, restTimer.endAt - Date.now());
    restTimer.status = 'paused';
    clearInterval(restTimer.interval);
    restTimer.interval = null;
    paintRestTimer();
  } else {
    if (restTimer.status === 'done' || restTimer.remainingMs <= 0) restTimer.remainingMs = restTimer.total * 1000;
    runRestTimer();
  }
}

function resetRestTimer() {
  clearInterval(restTimer.interval);
  restTimer.interval = null;
  restTimer.remainingMs = restTimer.total * 1000;
  restTimer.status = 'paused';
  paintRestTimer();
}

function closeRestTimer() {
  clearInterval(restTimer.interval);
  restTimer.interval = null;
  restTimer.status = 'idle';
  const el = document.getElementById('rest-timer');
  if (el) el.classList.remove('open', 'done');
}

/* Double progression : 2 séances de suite au top de la fourchette
   -> +2 reps débloqués sur ce mouvement (plafonné, puis conseil de lest). */
function logExerciseTop(key) {
  const p = getProgressState(key);
  if (p.bonus >= PROGRESS_CAP) return;
  if (p.unlocked) { p.unlocked = false; p.streak = 0; } // séance suivante : on repart sur une nouvelle fourchette
  p.streak += 1;
  if (p.streak >= 2) {
    p.bonus = Math.min(PROGRESS_CAP, p.bonus + 2);
    p.streak = 0;
    p.unlocked = true;
  }
  saveProfile();
  refreshProgressUI(key);
}

function refreshProgressUI(key) {
  const exo = withProgress(key);
  document.querySelectorAll('[data-repskey="' + key + '"]').forEach(td => {
    td.textContent = exo.series + ' x ' + exo.reps;
  });
  document.querySelectorAll('[data-progress-block="' + key + '"]').forEach(el => {
    el.innerHTML = renderProgressRow(key);
  });
  if (window.lucide) lucide.createIcons();
}

function renderProgressRow(key) {
  const prog = getProgressState(key);
  const maxed = prog.bonus >= PROGRESS_CAP;
  const filled = prog.unlocked ? 2 : prog.streak;
  const dots = [0, 1].map(i => `<span class="inline-block w-1.5 h-1.5 rounded-full ${i < filled ? 'bg-gold' : 'bg-line'}"></span>`).join('');
  let icon = 'flame', text = 'Haut de la fourchette atteint', btnClass = 'bg-goldLight text-violet-300';
  if (maxed) {
    icon = 'check-circle-2'; text = 'Palier max atteint'; btnClass = 'bg-line text-muted';
  } else if (prog.unlocked) {
    icon = 'unlock'; text = 'Palier supérieur débloqué'; btnClass = 'bg-emerald-500/15 text-emerald-400';
  }
  return `
    <div class="flex items-center gap-2 flex-wrap">
      <button onclick="logExerciseTop('${key}')" ${maxed ? 'disabled' : ''}
        class="text-[11px] font-medium rounded-full px-2.5 py-1 ${btnClass}">
        <i data-lucide="${icon}"></i> ${text}
      </button>
      <span class="flex gap-1">${dots}</span>
      ${prog.bonus > 0 ? `<span class="text-[10px] text-violet-300 font-medium">+${prog.bonus} reps débloqués</span>` : ''}
    </div>
    ${maxed ? `<p class="text-[11px] text-violet-300 mt-1">Ajoute du lest (sac à dos) pour continuer à progresser sur ce mouvement.</p>` : ''}
  `;
}

function buildProgram() {
  const d = state.data;
  const push = withProgress('push');
  const shoulder = withProgress('shoulder');
  const triceps = withProgress('triceps');
  const pull = withProgress('pull');
  const pullFriday = withProgress('pullFriday');
  const trap = withProgress('trap');
  const legs = withProgress('legs');
  const calf = withProgress('calf');
  const core = withProgress('core');

  const age = Number(d.age), taille = Number(d.taille), poids = Number(d.poids);
  // Objectif nutritionnel : prise de masse (+300 kcal) ou séchage (-400 kcal).
  // Par défaut (anciens profils sans réponse) : prise de masse.
  const goal = d.objectifNutrition === 'seche' ? 'seche' : 'masse';
  const kcalDelta = goal === 'seche' ? -400 : 300;
  let maintien = null, objectifKcal = null, macros = null;
  if (age > 0 && taille > 0 && poids > 0) {
    const bmr = (10 * poids) + (6.25 * taille) - (5 * age) + 5; // Mifflin-St Jeor (homme)
    maintien = Math.round(bmr * 1.5);
    objectifKcal = maintien + kcalDelta;
    // Macros : protéines 2 g/kg, lipides 1 g/kg, glucides = le reste (P/G = 4 kcal/g, L = 9 kcal/g)
    const prot = Math.round(poids * 2);
    const lip = Math.round(poids * 1);
    const gluc = Math.max(0, Math.round((objectifKcal - prot * 4 - lip * 9) / 4));
    macros = { prot, lip, gluc };
  }
  const ratioTaillePoids = (taille > 0 && poids > 0) ? (taille / poids).toFixed(2) : null;

  return { push, shoulder, triceps, pull, pullFriday, trap, legs, calf, core, maintien, objectifKcal, goal, kcalDelta, macros, ratioTaillePoids };
}

   SCHEMA ANATOMIQUE (SVG épuré : face + dos)
   Muscles principaux = violet #634BB3 plein, secondaires = violet atténué.
========================================================= */
const MUSCLE_COLOR = '#634BB3';
const MUSCLE_LABELS = {
  chest: 'Pectoraux', delts: 'Épaules', biceps: 'Biceps', triceps: 'Triceps', abs: 'Abdominaux',
  quads: 'Quadriceps', traps: 'Trapèzes', lats: 'Dorsaux', glutes: 'Fessiers', hams: 'Ischio-jambiers', calves: 'Mollets'
};
const EXO_MUSCLES = {
  push:       { p: ['chest'],           s: ['delts', 'triceps'] },
  shoulder:   { p: ['delts'],           s: ['triceps'] },
  triceps:    { p: ['triceps'],         s: ['chest', 'delts'] },
  pull:       { p: ['lats', 'biceps'],  s: ['traps', 'delts'] },
  pullFriday: { p: ['lats', 'traps'],   s: ['biceps', 'delts'] },
  trap:       { p: ['traps'],           s: ['delts'] },
  legs:       { p: ['quads', 'glutes'], s: ['hams'] },
  calf:       { p: ['calves'],          s: [] },
  core:       { p: ['abs'],             s: [] }
};

function renderAnatomy(key) {
  const m = EXO_MUSCLES[key];
  if (!m) return '';
  const level = id => m.p.includes(id) ? 1 : (m.s.includes(id) ? 0.45 : 0);
  // Dessine un muscle (côté gauche seulement si `mirror`), uniquement s'il est sollicité.
  const muscle = (id, inner, mirror) => {
    const o = level(id);
    if (!o) return '';
    const side = `<g fill="${MUSCLE_COLOR}" fill-opacity="${o}">${inner}</g>`;
    return mirror ? side + `<g transform="scale(-1 1)">${side}</g>` : side;
  };
  const outline = `
    <g fill="rgba(255,255,255,0.05)" stroke="currentColor" stroke-opacity="0.32" stroke-width="0.8" stroke-linejoin="round">
      <circle cx="0" cy="8" r="6"/>
      <path d="M-14 20 C-8 16 8 16 14 20 L11 36 L9.5 52 L10.5 58 L-10.5 58 L-9.5 52 L-11 36 Z"/>
      <g>
        <ellipse cx="-19.5" cy="32" rx="4" ry="11.5" transform="rotate(6 -19.5 32)"/>

        <ellipse cx="-5.8" cy="71" rx="6" ry="14.5"/>

      </g>
      <g transform="scale(-1 1)">
        <ellipse cx="-19.5" cy="32" rx="4" ry="11.5" transform="rotate(6 -19.5 32)"/>
        <ellipse cx="-22" cy="49" rx="3.2" ry="9.5" transform="rotate(4 -22 49)"/>
        <ellipse cx="-5.8" cy="71" rx="6" ry="14.5"/>
        <ellipse cx="-5.8" cy="93" rx="4" ry="10"/>
      </g>
    </g>`;
  const front = `
    <g transform="translate(30 0)">
      ${outline}
      ${muscle('chest',  '<ellipse cx="-6.6" cy="26" rx="6.4" ry="5"/>', true)}
      ${muscle('delts',  '<ellipse cx="-16" cy="22" rx="4.2" ry="4.8"/>', true)}
      ${muscle('biceps', '<ellipse cx="-19.8" cy="33" rx="3" ry="7" transform="rotate(6 -19.8 33)"/>', true)}
      ${muscle('abs',    '<rect x="-5" y="33" width="10" height="17" rx="3"/>', false)}
      ${muscle('quads',  '<ellipse cx="-5.8" cy="70" rx="4.8" ry="12"/>', true)}
    </g>`;
  const back = `
    <g transform="translate(90 0)">
      ${outline}
      ${muscle('traps',   '<path d="M0 15 L-11 20 L-4 31 L0 35 L4 31 L11 20 Z"/>', false)}
      ${muscle('delts',   '<ellipse cx="-16" cy="22" rx="4.2" ry="4.8"/>', true)}
      ${muscle('triceps', '<ellipse cx="-19.8" cy="33" rx="3" ry="7" transform="rotate(6 -19.8 33)"/>', true)}
      ${muscle('lats',    '<path d="M-12.5 26 L-2.5 33 L-3.5 49 L-9 50 L-11.5 38 Z"/>', true)}
      ${muscle('glutes',  '<ellipse cx="-5" cy="60" rx="5" ry="4.6"/>', true)}
      ${muscle('hams',    '<ellipse cx="-5.8" cy="73" rx="4.8" ry="10"/>', true)}
      ${muscle('calves',  '<ellipse cx="-5.8" cy="92" rx="3.4" ry="8"/>', true)}
    </g>`;
  const names = m.p.concat(m.s).map(id => MUSCLE_LABELS[id]);
  const caption = m.p.map(id => MUSCLE_LABELS[id]).join(' · ');
  return `
    <div class="anat-wrap">
      <svg class="anat-svg" viewBox="0 0 120 104" role="img" aria-label="Muscles sollicités : ${names.join(', ')}" xmlns="http://www.w3.org/2000/svg">
        <title>Muscles sollicités : ${names.join(', ')}</title>

    </div>`;
}

let exoVideoObserver = null;
function activateExoVideo(v, visible) {
  const url = v.dataset.src;
  if (!url) return; // pas de lien renseigné : le placeholder reste affiché
  if (visible) {
    if (!v.getAttribute('src')) {
      v.addEventListener('loadeddata', () => {
        v.classList.add('ready');
        if (v.parentElement) v.parentElement.classList.add('has-video');
      }, { once: true });
      v.src = url;
    }
    const pr = v.play();
    if (pr && pr.catch) pr.catch(() => {});
  } else {
    v.pause();
  }
}
function observeExoVideos() {
  const vids = document.querySelectorAll('video[data-exo-video]');
  if (!vids.length) return;
  if (!('IntersectionObserver' in window)) { vids.forEach(v => activateExoVideo(v, true)); return; }
  if (exoVideoObserver) exoVideoObserver.disconnect(); // évite d'accumuler des vidéos déjà retirées du DOM
  else exoVideoObserver = new IntersectionObserver(entries => {
    entries.forEach(en => activateExoVideo(en.target, en.isIntersecting));
  }, { threshold: 0.25 });
  vids.forEach(v => exoVideoObserver.observe(v));
}

/* =========================================================
   STREAK (jours consécutifs avec au moins une habitude cochée)
========================================================= */
function isoDaysAgo(n) {
  const d = new Date();
  d.setDate(d.getDate() - n);
  const pad = x => String(x).padStart(2, '0');
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}

async function loadStreakHistory(studentId) {
  try {
    const { data, error } = await supabaseClient.from('daily_habits')
      .select('date, seance_validee, calories_atteintes, sommeil_hydratation')
      .eq('student_id', studentId).gte('date', isoDaysAgo(400))
      .order('date', { ascending: false }).limit(500);
    if (error) throw error;
    state.streakDates = (data || [])
      .filter(r => r.seance_validee || r.calories_atteintes || r.sommeil_hydratation)
      .map(r => String(r.date).slice(0, 10));
    state.sessionDoneDates = (data || []).filter(r => r.seance_validee).map(r => String(r.date).slice(0, 10));
    state.streakLoaded = true;
  } catch (e) {
    state.streakDates = [];
    state.sessionDoneDates = [];
    state.streakLoaded = false; // en cas d'erreur réseau, on masque le badge plutôt que d'afficher un faux "0"
  }
}

function computeStreak() {
  const done = new Set(state.streakDates);
  const today = todayISO();
  const h = state.todayHabits || {};
  const todayDone = !!(h.seance_validee || h.calories_atteintes || h.sommeil_hydratation);
  done.delete(today); // aujourd'hui : on se fie à l'état en direct de la check-list
  let count = todayDone ? 1 : 0; // si aujourd'hui n'est pas encore coché, la série n'est pas rompue : elle repart d'hier
  let i = 1;
  while (done.has(isoDaysAgo(i))) { count++; i++; }
  return { count, todayDone };
}

function streakBadgeInner() {
  if (!state.streakLoaded) return '';
  const { count, todayDone } = computeStreak();
  const own = !(state.session.isAdmin && state.viewingStudentId !== state.session.userId);
  let hint = '';
  if (own && !todayDone) hint = count > 0 ? 'Coche une habitude aujourd\'hui pour garder ta série.' : 'Coche une habitude aujourd\'hui pour lancer ta série.';
  return `
    <div class="streak-badge ${count > 0 ? 'on' : ''}">
      <span class="streak-flame">🔥</span>
      <div>
        <p class="streak-title">Série en cours : ${count} jour${count > 1 ? 's' : ''}</p>
        ${hint ? `<p class="streak-hint">${hint}</p>` : ''}
      </div>
    </div>`;
}
function renderStreakBadge() { return `<div data-streak-wrap>${streakBadgeInner()}</div>`; }
function refreshStreakBadge() {
  document.querySelectorAll('[data-streak-wrap]').forEach(el => { el.innerHTML = streakBadgeInner(); });
}

function currentDayIndex() {
  const i = state.selectedDay;
  return (Number.isInteger(i) && i >= 0 && i <= 6) ? i : todayWeekIndex();

function isoForWeekIdx(idx) {
  const d = new Date();
  d.setDate(d.getDate() - todayWeekIndex() + idx);
  const pad = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
}

function isDayDone(idx) {
  const iso = isoForWeekIdx(idx);
  if (iso === todayISO()) return !!(state.todayHabits && state.todayHabits.seance_validee);
  return Array.isArray(state.sessionDoneDates) && state.sessionDoneDates.includes(iso);
}

function dayDotsHtml(idx) {
  return (idx === todayWeekIndex() ? '<span class="day-dot dot-today"></span>' : '')
       + (isDayDone(idx) ? '<span class="day-dot dot-done"></span>' : '');
}

function refreshDayDots() {
  document.querySelectorAll('.day-chip').forEach(b => {

/* Centre la pastille active dans la rangée (défilement horizontal) */
function centerActiveDayChip(smooth) {
  const row = document.querySelector('.day-tabs');
  const chip = row && row.querySelector('.day-chip.active');
  if (!row || !chip || row.scrollWidth <= row.clientWidth) return;
  row.scrollTo({ left: chip.offsetLeft - (row.clientWidth - chip.offsetWidth) / 2, behavior: smooth ? 'smooth' : 'auto' });
}

  const cur = currentDayIndex();

  state.selectedDay = idx;
  document.querySelectorAll('.day-chip').forEach(b => {
    const on = Number(b.dataset.dayIdx) === idx;

========================================================= */
function formatDate(ts) {
  if (!ts) return '—';
  return new Date(ts).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
}
function nextRetestDate(lastTestTs) {
  const base = lastTestTs || Date.now();
  return base + RETEST_DELAY_DAYS * 24 * 60 * 60 * 1000;
}

/* =========================================================
   HISTORIQUE DE PROGRESSION (poids + score de force dans le temps)
========================================================= */
const POMPES_LEVELS = ['0', '1-5', '6-15', '15+'];
const TRACTIONS_LEVELS = ['0', '1-5', '6-12', '12+'];
const DIPS_LEVELS = ['0', '1-3', '4-10', '10+'];

function levelIndex(levels, value) {
  const i = levels.indexOf(value);
  return i === -1 ? 0 : i;
}
function computeForceScore(d) {
  return levelIndex(POMPES_LEVELS, d.pompes) + levelIndex(TRACTIONS_LEVELS, d.tractions) + levelIndex(DIPS_LEVELS, d.dips);
}
function logHistoryEntry() {
  const d = state.data;
  if (!Array.isArray(d.history)) d.history = [];
  d.history.push({
    date: d.lastTestDate || Date.now(),
    poids: d.poids !== '' ? Number(d.poids) : null,
    force: computeForceScore(d),
  });
  if (d.history.length > 24) d.history = d.history.slice(-24);
}

function renderSparkline(values, color) {
  const w = 100, h = 36;
  const pts = values.map((v, i) => ({ v, i })).filter(p => p.v !== null && p.v !== undefined && !isNaN(p.v));
  if (pts.length < 2) return '<p class="text-[11px] text-muted">Pas assez de données.</p>';
  const min = Math.min(...pts.map(p => p.v));
  const max = Math.max(...pts.map(p => p.v));
  const range = (max - min) || 1;
  const stepX = w / (values.length - 1 || 1);
  const coords = pts.map(p => {
    const x = (p.i * stepX).toFixed(1);
    const y = (h - ((p.v - min) / range) * (h - 6) - 3).toFixed(1);
    return x + ',' + y;
  }).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" class="evo-sparkline" preserveAspectRatio="none"><polyline points="${coords}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></svg>`;
}

function renderEvolutionCard() {
  const d = state.data;
  const history = Array.isArray(d.history) ? d.history : [];
  if (history.length < 2) {
    return `
      <div class="rounded-2xl border border-line bg-surface p-5 mb-6 surface-card">
        <p class="text-sm font-semibold mb-1 flex items-center gap-1.5"><i data-lucide="trending-up" class="text-gold" style="font-size:14px;"></i>Ton évolution</p>
        <p class="text-xs text-muted">Ta courbe de progression apparaîtra ici après ton prochain bilan de force.</p>
      </div>
    `;
  }
  const poidsValues = history.map(h => h.poids);
  const forceValues = history.map(h => h.force);
  const poidsDelta = poidsValues[poidsValues.length - 1] - poidsValues[0];
  const forceDelta = forceValues[forceValues.length - 1] - forceValues[0];
  const deltaTag = (delta, unit) => {
    if (isNaN(delta) || delta === 0) return '';
    const cls = delta > 0 ? 'text-emerald-600' : 'text-red-500';
    const sign = delta > 0 ? '+' : '';
    return `<span class="${cls} font-semibold">${sign}${Number(delta.toFixed(1))}${unit}</span>`;
  };
  return `
    <div class="rounded-2xl border border-line bg-surface p-5 mb-6 surface-card">
      <p class="text-sm font-semibold mb-3 flex items-center gap-1.5"><i data-lucide="trending-up" class="text-gold" style="font-size:14px;"></i>Ton évolution <span class="text-xs font-normal text-muted">(${history.length} bilans)</span></p>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <p class="text-[11px] text-muted mb-1">Poids ${deltaTag(poidsDelta, 'kg')}</p>
          ${renderSparkline(poidsValues, '#8a72e0')}
        </div>
        <div>
          <p class="text-[11px] text-muted mb-1">Score de force ${deltaTag(forceDelta, '')}</p>
          ${renderSparkline(forceValues, '#E2E8F0')}
        </div>
      </div>
      <p class="text-[11px] text-muted mt-3">${formatDate(history[0].date)} → ${formatDate(history[history.length - 1].date)}</p>
    </div>
  `;
}

/* Ouvre / ferme le volet Réglages (mot de passe + déconnexion) sans re-render */
function toggleSettings() {
  state.settingsOpen = !state.settingsOpen;

/* =========================================================
   EXPORT PDF (impression native) — gabarit dédié, indépendant
   de l'UI interactive (aucune check-list, aucun bouton de
   progression, aucune jauge, aucun message de lest)
========================================================= */
function printExoTable(rows) {
  return `
    <table>
      <thead><tr><th>Exercice</th><th>Séries x Reps</th><th>Repos</th><th>Consigne</th></tr></thead>
      <tbody>
        ${rows.map(r => `
          <tr>
            <td><strong>${r.nom}</strong></td>
            <td>${r.series} x ${r.reps}</td>
            <td>${r.repos}</td>
            <td>${r.consigne || ''}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

function renderPrintDay(day) {
  let body = '';
  if (day.rows) {
    body = printExoTable(day.rows);
  } else if (day.circuit) {
    body = (day.circuitNote ? `<p class="print-note"><b>Format :</b> ${day.circuitNote}</p>` : '')
      + printExoTable(day.circuit.map(r => ({ ...r, series: 4, repos: '15s' })));
  } else if (day.light) {
    body = `<ul class="print-list">${day.light.map(l => `<li>${l}</li>`).join('')}</ul>`;
  }
  const warmup = day.warmup ? `<p class="print-note"><b>Échauffement (5 min) :</b> ${day.warmup}</p>` : '';
  const finisher = day.finisher ? `<p class="print-note"><b>${day.circuit ? 'Retour au calme' : 'Finisseur'} :</b> ${day.finisher}</p>` : '';
  return `
    <div class="day-card">
      <div class="day-card-head">
        <span><span class="day-card-title">${day.jour}</span><span class="day-card-focus">${day.focus}</span></span>
        <span class="day-card-duree">${day.duree}</span>
      </div>
      <p class="day-card-objectif"><b>Objectif —</b> ${day.objectif}</p>
      ${warmup}
      ${body}
      ${finisher}
    </div>
  `;
}

/* Construit le contenu <body> de la fiche imprimable (aucun élément
   de l'app en direct : c'est un document autonome, thème clair uniquement). */
function buildPrintContentHtml() {
  const d = state.data;
  const p = buildProgram();
  const week = buildWeek(p);
  const dateStr = new Date().toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
  return `
    <div class="print-header">
      <div>
        <div class="print-logo">MBZ <span>METHOD</span></div>
        <div class="print-subtitle">Fiche Athlète VIP</div>
      </div>
      <div class="print-date">Édité le ${dateStr}</div>
    </div>
    <div class="print-profile">
      <div>
        <p class="print-profile-name">${d.prenom || '—'}</p>
        <p class="print-profile-objectif">${d.objectif ? '"' + d.objectif + '"' : ''}</p>
      </div>
      <div class="print-profile-stats">
        <div class="print-stat"><span>${d.age || '—'}</span><label>Âge</label></div>
        <div class="print-stat"><span>${d.taille ? d.taille + ' cm' : '—'}</span><label>Taille</label></div>
        <div class="print-stat"><span>${d.poids ? d.poids + ' kg' : '—'}</span><label>Poids</label></div>
        <div class="print-stat"><span>${p.objectifKcal ? p.objectifKcal.toLocaleString('fr-FR') + ' kcal' : '—'}</span><label>Calories cibles</label></div>
      </div>
    </div>
    <h2 class="print-section-title">Planning hebdomadaire</h2>
    ${week.map(day => renderPrintDay(day)).join('')}
    <p class="print-footer">MBZ Method — Programme personnalisé généré pour usage individuel.</p>
  `;
}

function downloadPDF() {
  const { jsPDF } = window.jspdf;
  if (!jsPDF) {
    alert("Les librairies PDF se chargent, réessaie dans un instant.");
    return;
  }

  const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
  const d = state?.data || {};
  const p = typeof buildProgram === 'function' ? buildProgram() : {};
  const week = typeof buildWeek === 'function' ? buildWeek(p) : [];
  const dateStr = new Date().toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });

  // 1. EN-TÊTE CLEAN
  doc.setFont("helvetica", "bold");
  doc.setFontSize(18);
  doc.setTextColor(24, 24, 27);
  doc.text("MBZ ", 14, 18);
  
  doc.setTextColor(99, 75, 179);
  doc.text("METHOD", 28, 18);

  doc.setFont("helvetica", "normal");
  doc.setFontSize(8);
  doc.setTextColor(113, 113, 122);
  doc.text("PROGRAMME ATHLÉTIQUE VIP", 14, 23);
  doc.text(`Édité le ${dateStr}`, 196, 23, { align: "right" });

  doc.setDrawColor(99, 75, 179);
  doc.setLineWidth(0.6);
  doc.line(14, 26, 196, 26);

  // 2. BLOC PROFIL & NUTRITION
  doc.setFillColor(250, 250, 250);
  doc.setDrawColor(228, 228, 231);
  doc.roundedRect(14, 30, 182, 18, 2, 2, "FD");

  doc.setFont("helvetica", "bold");
  doc.setFontSize(12);
  doc.setTextColor(24, 24, 27);
  doc.text(`${d.prenom || 'Athlète'}`, 18, 37);

  doc.setFont("helvetica", "normal");
  doc.setFontSize(8.5);
  doc.setTextColor(113, 113, 122);
  const statsClean = `${d.age || '—'} ans   |   ${d.taille || '—'} cm   |   ${d.poids || '—'} kg`;
  doc.text(statsClean, 18, 43);

  // Nutrition Cible
  doc.setFont("helvetica", "bold");
  doc.setFontSize(12);
  doc.setTextColor(99, 75, 179);
  doc.text(`${p.objectifKcal || '—'} kcal`, 190, 37, { align: "right" });
  doc.setFont("helvetica", "normal");
  doc.setFontSize(8);
  doc.setTextColor(113, 113, 122);
  doc.text(`Cible journalière (${p.kcalDelta > 0 ? "+" : "-"}${Math.abs(p.kcalDelta || 300)} kcal)`, 190, 43, { align: "right" });

  // 3. GÉNÉRATION DES JOURS
  let startY = 54;

  week.forEach((day, index) => {
    const items = day.rows || (day.circuit ? day.circuit.map(r => ({ ...r, series: 4, repos: '15s' })) : []);

    // Gestion du saut de page
    if (startY > 235) {
      doc.addPage();
      startY = 18;
    }

    // Ligne de séparation discrète entre les jours (sauf le tout premier)
    if (index > 0 && startY > 55) {
      doc.setDrawColor(244, 244, 245);
      doc.setLineWidth(0.4);
      doc.line(14, startY - 2, 196, startY - 2);
      startY += 2;
    }

    let cleanJour = (day.jour || '').replace(/^(dumbbell|chevrons-up|footprints|wind|rocket|flame|moon)\s*/i, '');

    // Titre + Durée
    doc.setFont("helvetica", "bold");
    doc.setFontSize(10);
    doc.setTextColor(24, 24, 27);
    doc.text(`${cleanJour} - ${day.focus || ''}`, 14, startY);

    doc.setFont("helvetica", "bold");
    doc.setFontSize(8);
    doc.setTextColor(99, 75, 179);
    doc.text(`${day.duree || ''}`, 196, startY, { align: "right" });

    startY += 4;

    // Échauffement (si présent)
    if (day.warmup) {
      doc.setFont("helvetica", "normal");
      doc.setFontSize(7.5);
      doc.setTextColor(113, 113, 122);
      let cleanWarmup = day.warmup.replace(/(-\s*5\s*min\.?|5\s*min\.?)$/gi, '').trim();
      doc.text(`Échauffement (5 min) : ${cleanWarmup}`, 14, startY);
      startY += 3.5;
    }

    // Mention du format circuit (Samedi) : 45s d'effort / 15s de repos, 4 tours
    if (day.circuit) {
      doc.setFont("helvetica", "bold");
      doc.setFontSize(7.5);
      doc.setTextColor(99, 75, 179);
      doc.text(`Format : ${day.circuitNote || "45s d'effort / 15s de repos entre les exercices, 4 tours au total."}`, 14, startY);
      startY += 3.5;
    }

    // SI LE JOUR A DES EXERCICES (Lundi, Mardi, Mercredi, Vendredi, Samedi)
    if (items.length > 0) {
      const tableData = items.map(r => {
        const nomExercice = r.nom || '';
        const consigneText = r.consigne ? `\n• ${r.consigne}` : '';
        return [nomExercice + consigneText, `${r.series} × ${r.reps}`, r.repos || '—'];
      });

      doc.autoTable({
        startY: startY,
        head: [['EXERCICE', 'SÉRIES × REPS', 'REPOS']],
        body: tableData,
        theme: 'plain',
        margin: { left: 14, right: 14 },
        styles: { 
          fontSize: 8, 
          cellPadding: 2, 
          overflow: 'linebreak',
          lineColor: [228, 228, 231], // Séparation bordure sous chaque exercice
          lineWidth: 0.25
        },
        headStyles: { 
          fillColor: [244, 244, 245], 
          textColor: [113, 113, 122], 
          fontStyle: 'bold', 
          fontSize: 7,
          lineColor: [212, 212, 216],
          lineWidth: 0.3
        },
        columnStyles: {
          0: { cellWidth: 120, fontStyle: 'bold' },
          1: { cellWidth: 34 },
          2: { cellWidth: 28 }
        }
      });

      startY = doc.lastAutoTable.finalY + 3;
    } 
    // SI C'EST UN JOUR SANS TABLEAU (Jeudi, Dimanche)
    else {
      doc.setFont("helvetica", "normal");
      doc.setFontSize(8);
      doc.setTextColor(82, 82, 91);

      // Récupération des consignes / instructions spécifiques du jour
      const lightList = day.light || day.instructions || day.details || [];
      
      if (Array.isArray(lightList) && lightList.length > 0) {
        lightList.forEach(item => {
          doc.text(`• ${item}`, 16, startY);
          startY += 3.8;
        });
      } else if (day.objectif) {
        doc.text(`Consigne : ${day.objectif}`, 16, startY);
        startY += 3.8;
      }
      
      startY += 1;
    }

    // Finisher (si présent)
    if (day.finisher) {
      doc.setFont("helvetica", "normal");
      doc.setFontSize(7.5);
      doc.setTextColor(113, 113, 122);
      let cleanFinisher = day.finisher.replace(/(-\s*5\s*min\.?|5\s*min\.?)$/gi, '').trim();
      doc.text(`Finisher : ${cleanFinisher}`, 14, startY);
      startY += 4.5;
    }

    startY += 3;
  });

  // 4. TÉLÉCHARGEMENT DIRECT
  const prenomFile = d.prenom ? d.prenom.toLowerCase() : 'mon';
  doc.save(`${prenomFile}-programme-mbz-method.pdf`);
}

function restart() {
  const keep = {
    history: state.data.history,
    adminNotes: state.data.adminNotes,
    motivationMessage: state.data.motivationMessage
  };
  state.step = 0;
  state.openDays = {};
  state.data = Object.assign(defaultData(), keep);
  saveProfile();
  render();
}

/* Re-test à 3 semaines : on garde l'identité et le matériel,
   on ne redemande que le test de force + jambes/énergie.
   La progression fine (bonus de reps) repart de zéro : le nouveau
   palier mesuré au re-test remplace l'ancien, pas de double comptage. */
function startRetest() {
  state.data.pompes = null;
  state.data.tractions = null;
  state.data.dips = null;
  state.data.jambes = null;
  state.data.energie = null;
  state.data.progress = {};
  state.openDays = {};
  state.step = 1;
  render();
}

/* =========================================================
   NAVIGATION
========================================================= */
function goNext() {
  if (!isStepValid(state.step)) return;
  const reachingResult = state.step === TOTAL_STEPS - 1;
  state.step = reachingResult ? TOTAL_STEPS : state.step + 1;
  if (reachingResult) {
    state.data.lastTestDate = Date.now();
    logHistoryEntry();
  }
  saveProfile();
  render();
}
function goBack() {
  if (state.step > 0) { state.step -= 1; render(); }
}

/* =========================================================
   RENDU PRINCIPAL
========================================================= */
function renderAdminBanner() {
  if (!(state.session.isAdmin && state.adminView === 'editingStudent')) return '';
  const s = state.students.find(x => x.id === state.viewingStudentId);
  const name = s ? (s.prenom || s.identifiant) : '';
  return `
    <div class="admin-banner">
      <div class="admin-banner-row">
        <button onclick="backToDashboard()" class="admin-banner-back"><i data-lucide="arrow-left" style="font-size:11px;"></i> Tableau de bord</button>
        <span class="admin-banner-tag"><i data-lucide="wrench" style="font-size:11px;"></i> Mode admin</span>
      </div>
      <div class="admin-banner-row admin-banner-row--main">
        <span class="admin-banner-name">${name}</span>
        <button onclick="toggleAdminTools()" class="admin-banner-toggle flex items-center gap-1">${state.adminToolsOpen ? 'Masquer <i data-lucide="chevron-up" style="font-size:11px;"></i>' : 'Notes & message <i data-lucide="chevron-down" style="font-size:11px;"></i>'}</button>
      </div>
      ${state.adminToolsOpen ? renderAdminTools() : ''}
    </div>
  `;
}

function toggleAdminTools() {
  state.adminToolsOpen = !state.adminToolsOpen;
  render();
}

function renderAdminTools() {
  const d = state.data;
  return `
    <div class="admin-tools">
      <div>
        <label class="admin-tools-label"><i data-lucide="message-circle" style="font-size:12px;"></i> Message de motivation (visible par l'élève à sa connexion)</label>
        <textarea id="admin-motivation" rows="2" placeholder="Ex : Bravo pour ta régularité cette semaine, continue comme ça !"
          class="admin-tools-textarea">${d.motivationMessage || ''}</textarea>
        <button onclick="saveMotivationMessage()" class="admin-tools-save mt-2">Envoyer / Mettre à jour</button>
      </div>
      <div>
        <label class="admin-tools-label"><i data-lucide="lock" style="font-size:12px;"></i> Notes privées (visibles par toi uniquement)</label>
        <textarea id="admin-notes" rows="3" placeholder="Ressenti, points d'attention, historique d'échanges..."
          class="admin-tools-textarea" onblur="saveAdminNotes()">${d.adminNotes || ''}</textarea>
      </div>
    </div>
  `;
}

function saveAdminNotes() {
  const el = document.getElementById('admin-notes');
  if (!el) return;
  state.data.adminNotes = el.value;
  saveProfile();
}

function saveMotivationMessage() {
  const el = document.getElementById('admin-motivation');
  if (!el) return;
  state.data.motivationMessage = el.value.trim();
  saveProfile();
  const btn = document.querySelector('.admin-tools-save');
  if (btn) {
    const original = btn.innerHTML;
    btn.innerHTML = '<i data-lucide="check" style="font-size:11px;"></i> Enregistré';
    if (window.lucide) lucide.createIcons();
    setTimeout(() => { if (btn) { btn.innerHTML = original; if (window.lucide) lucide.createIcons(); } }, 1500);
  }
}

/* Bannière affichée à l'élève quand l'administrateur lui a laissé un message */
function renderMotivationBanner() {
  if (state.session.isAdmin) return '';
  if (!state.data.motivationMessage || state.motivationDismissed) return '';
  return `
    <div class="motivation-banner">
      <i data-lucide="message-circle" class="motivation-banner-icon" style="font-size:16px;"></i>
      <p class="motivation-banner-text">${state.data.motivationMessage}</p>
      <button onclick="dismissMotivation()" class="motivation-banner-close" aria-label="Fermer"><i data-lucide="x" style="font-size:13px;"></i></button>
    </div>
  `;
}

function dismissMotivation() {
  state.motivationDismissed = true;
  render();
}

function renderLogoutLink() {
  if (state.session.isAdmin) return '';
  return `<div class="logout-inline px-6 pt-4 flex justify-end"><button onclick="logout()" class="text-xs text-muted underline underline-offset-2">Déconnexion</button></div>`;
}

function renderHeader() {
  if (state.step >= TOTAL_STEPS) return renderAdminBanner() + renderLogoutLink() + renderMotivationBanner();
  const pct = ((state.step + 1) / TOTAL_STEPS) * 100;
  return `
    ${renderAdminBanner()}
    ${renderLogoutLink()}
    ${renderMotivationBanner()}
    <div class="px-6 pt-2 pb-2 flex items-center gap-3">
      <button onclick="goBack()" class="w-9 h-9 flex items-center justify-center rounded-full ${state.step === 0 ? 'opacity-0 pointer-events-none' : ''}" aria-label="Retour">
        <i data-lucide="arrow-left" class="text-ink" style="font-size:18px;"></i>
      </button>
      <div class="flex-1 h-1.5 rounded-full progress-track overflow-hidden">
        <div class="h-full rounded-full progress-fill" style="width:${pct}%"></div>
      </div>
      <span class="text-xs text-muted font-medium w-8 text-right">${state.step + 1}/${TOTAL_STEPS}</span>
    </div>
  `;
}

function renderCta() {
  if (state.step >= TOTAL_STEPS) return '';
  const valid = isStepValid(state.step);
  const label = state.step === TOTAL_STEPS - 1 ? 'Voir mon programme' : 'Suivant';
  return `
    <div class="cta-fixed-wrap">
      <div class="cta-wrap px-6 pb-6 pt-4" style="background: linear-gradient(to top, #08070d 65%, transparent);">
        <button id="cta-btn" onclick="goNext()" ${valid ? '' : 'disabled'}
          class="cta-btn w-full rounded-full py-4 font-semibold text-base">
          ${label}
        </button>
      </div>
    </div>
  `;
}

function updateCta() {
  const btn = document.getElementById('cta-btn');
  if (!btn) return;
  btn.disabled = !isStepValid(state.step);
}

function renderBody() {
  switch (state.step) {
    case 0: return renderStep0();
    case 1: return renderStep1();
    case 2: return renderStep2();
    case 3: return renderStep3();
    default: return renderResult();
  }
}

function render() {
  const app = document.getElementById('app');
  const isAdminDash = !state.authLoading && !!state.session.userId && state.session.isAdmin && state.adminView === 'dashboard';
  app.className = isAdminDash ? 'admin-shell' : 'app-shell pb-36';
  document.body.classList.toggle('admin-mode', isAdminDash);
  const showSidebar = !state.authLoading && !!state.session.userId && !isAdminDash && state.step >= TOTAL_STEPS;
  document.body.classList.toggle('has-sidebar', showSidebar);
  if (state.authLoading) {
    app.innerHTML = renderAuthLoading();
  } else if (!state.session.userId) {
    app.innerHTML = renderLogin();
  } else if (isAdminDash) {
    app.innerHTML = renderAdminDashboard();
  } else {
    app.innerHTML = (showSidebar ? renderStudentSidebar() + renderBottomNav() : '') + renderHeader() + renderBody() + renderCta();
  }
  if (window.lucide) lucide.createIcons();
  if (state.studentTab === 'nutrition') drawNutritionChart();
  if (state.studentTab === 'programme') centerActiveDayChip(false);
  if (state.studentTab === 'evolution' && document.getElementById('evo-weight-canvas')) drawWeightChart();
  if (typeof observeExoVideos === 'function') observeExoVideos();
  window.scrollTo(0, 0);
}

initApp();
</script>
